name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Java is required for the Firebase emulator (Firestore + Storage rules tests).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit & domain tests
        run: npm test -- --run

      - name: Firestore & Storage security rules tests
        run: npm run test:rules

      - name: Production build
        run: npm run build
        env:
          # These are CI placeholders — the build must succeed with any non-empty string values.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_RECAPTCHA_SITE_KEY: ci-recaptcha-placeholder
          VITE_ENABLE_DEMO_DATA: "false"
          VITE_MINIMUM_USER_AGE: "18"

      - name: Verify built assets exist
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f public/icon-192.png || (echo "public/icon-192.png missing" && exit 1)
          test -f public/icon-512.png || (echo "public/icon-512.png missing" && exit 1)
          echo "All required build artifacts present."

      - name: Security audit
        # Fail only on high/critical vulnerabilities; moderate are flagged but don't block CI.
        run: npm audit --audit-level=high
        continue-on-error: false
